<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body{
        background-color: #000;
        color: #3e3;
	max-width: 640px;
	margin: 1rem auto;
	padding: 0.5rem 1rem;
	box-sizing: border-box;
      }
      h1, h2, h3{
        color: #aea;
	margin: 0;
	margin-top:1em;
	&::before{
	  content: "~$ ";
	  color: #3e3;
	}
      }
      h3{
	margin-top: 0;
      }
      
      h1::before{
	content: "[legocris@space ~]$ ";
      }
      
      hr{
	position: relative;
	height: 16px;
	background-color: #aaa;
	border: none;
	&::after{
	  position: absolute;
	  top: 50%;
	  left: 0;
	  right: 0;
	  content: "";
	  transform: translateY(-50%);    
	  border-top: 3px dashed #000;
	}
      }
      p{
	margin: 0.2em;
	&::before{
	  content:"› ";
	  color: #3e3;
	}
      }
      a{
	color: #aea;
	&:hover{
	  background-color:#784; 
	}
      }
    </style>
  </head>
  <body >
    {{content}}
  </body>
</html>
