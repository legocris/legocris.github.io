<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body{
        background-color: #000;
        color: #3e3;
	max-width: 640px;
	margin: 1rem auto;
	padding: 0.5rem 1rem;
	box-sizing: border-box;
      }
      h1, h2{
          color: #aea;
	  margin: 0;
	  margin-top:1em;
	  a{
	      color: #aea;
	  }
      }

      h1::before{
	  content:"[legocris@Cristobal-Cortés ~]$ "
      }
      h2::before{
	  content: "~$ ";
      }
      
      hr{
	  position: relative;
	  height: 16px;
	  background-color: #aaa;
	  border: none;
	  &::after{
	      position: absolute;
	      top: 50%;
	      left: 0;
	      right: 0;
	      content: "";
	      transform: translateY(-50%);
	      
	      border-top: 3px dashed #000;
	  }
      }
      p{
	  margin: 0.2em;
	  &::before{
	      content:"› ";
	  }
      }
      a{
	  color: #aea;
	  &:hover{
	      background-color:#784;
	      
	  }
      }
    </style>
  </head>
  <body >
    {{content}}
  </body>
</html>
